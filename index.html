<script>
const K='trip-itin-v1',$=id=>document.getElementById(id),DEF=JSON.parse($('d').textContent);
let D,mode='',ed=false,iO=false;
const E=s=>String(s??'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const F=(p,v,t='span')=>`<${t} data-p="${p}"${ed?' contenteditable':''}>${E(v)}</${t}>`;
const G=p=>p?p.split('.').reduce((o,k)=>o[k],D):D;
const X=(a,i)=>`<span class="ops x"><button data-ins="${a}" data-i="${i}" title="在下方插入一列">＋</button><button data-mv="${a}" data-i="${i}" data-d="-1" title="上移">↑</button><button data-mv="${a}" data-i="${i}" data-d="1" title="下移">↓</button><button data-del="${a}" data-i="${i}" title="刪除">✕</button></span>`,A=a=>`<button class="x" data-add="${a}">＋新增</button>`;
const TPL={issues:{lv:'中',x:'新項目'},items:{t:'00:00',e:'新行程'},checklist:{g:'',x:'新項目',done:false},days:{date:'日期',title:'標題',flight:'',hotel:'',tip:'',items:[]}};
const save=()=>{try{localStorage[K]=JSON.stringify(D)}catch{}};
const M=()=>document.body.className=mode+(ed?' edit':'');
function R(){const d=D,L=(a,f)=>d[a].map(f).join('');
$('app').innerHTML=`<div class="card">${F('title',d.title,'h1')}<div class="m">${F('subtitle',d.subtitle)}</div></div>
<div class="card"><details${iO||ed?' open':''}><summary>行程審查（${d.issues.length} 項）</summary>${L('issues',(x,i)=>`<div class="iss"><b>${F(`issues.${i}.lv`,x.lv)}</b><div>${F(`issues.${i}.x`,x.x)}</div>${X('issues',i)}</div>`)}${A('issues')}</details></div>
${L('days',(y,i)=>{const p=`days.${i}.`;return `<div class="card"><h2>${F(p+'date',y.date)}｜${F(p+'title',y.title)}</h2><div class="m">航班：${F(p+'flight',y.flight)}<br>住宿：${F(p+'hotel',y.hotel)}</div>${y.items.map((r,j)=>`<div class="row"><span class="t">${F(`${p}items.${j}.t`,r.t)}</span><span>${F(`${p}items.${j}.e`,r.e)}</span>${X(p+'items',j)}</div>`).join('')}${A(p+'items')}<div class="m tip">提示：${F(p+'tip',y.tip)}</div></div>`})}
<div class="card"><h2>出發前確認清單</h2>${L('checklist',(c,i)=>`<div class="ck"><input type="checkbox" data-ck="${i}"${c.done?' checked':''}><span class="g">${F(`checklist.${i}.g`,c.g)}</span>${F(`checklist.${i}.x`,c.x)}${X('checklist',i)}</div>`)}${A('checklist')}</div>
${ed?'<div class="card"><button class="x" data-add="days">＋新增一天</button></div>':''}`}
$('app').addEventListener('toggle',e=>{if(!ed)iO=e.target.open},true);
$('app').oninput=e=>{const p=e.target.dataset.p;if(p){const a=p.split('.'),k=a.pop();G(a.join('.'))[k]=e.target.innerText.trim();save()}};
$('app').onclick=e=>{const t=e.target,s=t.dataset;
if(s.add){G(s.add).push(structuredClone(TPL[s.add.split('.').pop()]));save();R()}
else if(s.ins){G(s.ins).splice(+s.i+1,0,structuredClone(TPL[s.ins.split('.').pop()]));save();R()}
else if(s.mv){const a=G(s.mv),i=+s.i,j=i+ +s.d;if(j>=0&&j<a.length){[a[i],a[j]]=[a[j],a[i]];save();R()}}
else if(s.del){G(s.del).splice(+s.i,1);save();R()}
else if(s.ck!=null){D.checklist[s.ck].done=t.checked;save()}};
document.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>{mode=b.dataset.m;document.querySelectorAll('[data-m]').forEach(x=>x.classList.toggle('on',x==b));M()});
$('ed').onclick=e=>{ed=!ed;e.target.classList.toggle('on',ed);M();R()};
$('pr').onclick=()=>print();
$('ex').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(D,null,2)],{type:'application/json'}));a.download='itinerary.json';a.click()};
$('im').onchange=e=>{const f=e.target.files[0];if(f)f.text().then(t=>{try{D=JSON.parse(t);save();R()}catch{alert('JSON 格式錯誤，未匯入')}})};
$('rs').onclick=()=>{if(confirm('還原為內建預設內容？目前的修改會被覆蓋。')){localStorage.removeItem(K);D=structuredClone(DEF);R();fetch('itinerary.json').then(r=>r.json()).then(j=>{D=j;R()}).catch(()=>{})}};
let s=null;try{s=JSON.parse(localStorage[K])}catch{}
D=s||structuredClone(DEF);R();
if(!s)fetch('itinerary.json').then(r=>r.json()).then(j=>{D=j;R()}).catch(()=>{});
</script></body></html>
